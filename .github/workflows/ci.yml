name: Python tests and static web checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[api,chem,test]"
      - name: Compile Python files
        run: python -m compileall -q agents smiles_transformer tests cli.py simulator.py enrichment.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify JavaScript parses and static UI has no simulated audit output
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          assert "DOSSIER-SIM" not in html and "HMAC_SHA256_" not in html
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          assert scripts and scripts[-1].strip()
          Path("/tmp/smiles-web.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/smiles-web.js
      - name: Check whitespace
        run: git diff --check
